# Which escape sequence each terminal accepts for desktop notifications.
#
# `verified` marks entries confirmed by actual measurement, as opposed to
# entries transcribed from documentation. `tested_version` records which
# release was measured, where naming it is useful.

# --- What each sequence can express -------------------------------------
# Capabilities are a property of the sequence itself, not of the terminal.

[sequences.osc9]
form  = "OSC 9 ; <body> BEL"
title = false
body  = true
id    = false

[sequences.osc777]
form  = "OSC 777 ; notify ; <title> ; <body> BEL"
title = true
body  = true
id    = false

[sequences.osc99]
form  = "OSC 99 ; <metadata> ; <body> ST"
title = true
body  = true
id    = true      # notifications can be replaced or deduplicated

# --- Terminals -----------------------------------------------------------
# `env` names variables whose mere presence identifies the terminal. Only the name is
# evidence — the values are per-session and would match nothing. It is the only channel
# left for a terminal that answers no query and sets neither TERM_PROGRAM nor a TERM of
# its own.
#
# `accepts` is ordered: richest first. Sending is the other way round — it
# takes the least expressive entry that still carries what was asked for,
# so that no field has to go out empty. Ghostty, for one, wants all three
# fields of an OSC 777 and raises nothing when the body is left off.

[[terminals]]
id             = "ghostty"
xtversion      = "ghostty"
term_program   = ["ghostty"]
term           = ["xterm-ghostty"]
env            = []
accepts        = ["osc777", "osc9"]
verified       = true
tested_version = "1.3.1"

[[terminals]]
id             = "kitty"
xtversion      = "kitty"
term_program   = []                 # kitty sets no TERM_PROGRAM
term           = ["xterm-kitty"]
env            = []
accepts        = ["osc99", "osc777", "osc9"]
verified       = true
tested_version = "0.48.2"

[[terminals]]
id             = "iterm2"
xtversion      = "iTerm2"
term_program   = ["iTerm.app"]
term           = []
env            = []
accepts        = ["osc9"]
verified       = true
tested_version = "3.6.11"

[[terminals]]
id             = "apple-terminal"
xtversion      = ""                 # does not answer XTVERSION
term_program   = ["Apple_Terminal"]
term           = []
env            = []
accepts        = []                 # no OSC notification support; bell only
verified       = true

[[terminals]]
id             = "wezterm"
xtversion      = "WezTerm"
term_program   = ["WezTerm"]
term           = []                 # sets only xterm-256color, which names no terminal
env            = []
accepts        = []                 # nothing appeared, with notifications permitted
verified       = true
tested_version = "20240203-110809-5046fc22"

# Windows Terminal answers no XTVERSION, sets no TERM_PROGRAM, and sets only
# xterm-256color, so WT_SESSION is the only thing that names it. Its OSC notification
# support is unmerged upstream (microsoft/terminal#20012). Measured from WSL, where the
# sequences reach the same terminal they would from a native shell.
[[terminals]]
id             = "windows-terminal"
xtversion      = ""
term_program   = []
term           = []
env            = ["WT_SESSION"]
accepts        = []                 # nothing appeared, with notifications permitted
verified       = true
tested_version = "1.24.11911.0"
